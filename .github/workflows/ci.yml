name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      GIT_ASKPASS: ""
      SSH_ASKPASS: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run with default inputs
        uses: $/
        with:
          token: ${{ github.token }}
          repositories: mathematic-inc/scoped-git-token-action
          run: |
            test -f action.yml
            printf 'url=%s\n\n' "$GITHUB_SERVER_URL/mathematic-inc/scoped-git-token-action" | git credential fill >/dev/null
      - name: Set prior Git config
        run: |
          cat >> "$GITHUB_ENV" <<'CONFIG'
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0=test.preserved
          GIT_CONFIG_VALUE_0=present
          CONFIG
      - name: Check credentials and trace
        uses: $/
        env:
          TEST_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          repositories: |
            mathematic-inc/scoped-git-token-action

              mona-cat_octo/another_repo.test
          working-directory: tests
          run: bash credentials.sh present
      - name: Check next step has no credentials
        run: bash tests/credentials.sh absent
      - name: Return command failure
        id: failing-command
        continue-on-error: true
        uses: $/
        with:
          token: ${{ github.token }}
          repositories: mathematic-inc/scoped-git-token-action
          run: exit 37
      - name: Check failed step outcome
        env:
          FAILING_COMMAND_OUTCOME: ${{ steps.failing-command.outcome }}
        run: test "$FAILING_COMMAND_OUTCOME" = failure
      - name: Check script contracts
        run: bash tests/contracts.sh
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Check and generate ToolConfig files
        uses: mathematic-inc/toolconfig-action@1baf7b021e8bf6f0e20737753c13af0fc93c8570 # v2026.11.0
      - name: Run checks
        run: hk check --all --slow --skip-step toolconfig
  required:
    name: required
    if: always()
    needs: [verify, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
